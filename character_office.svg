<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall & floor -->
    <rect x="0" y="0" width="1024" height="720" fill="#EAF1F4" stroke="none"/>
    <rect x="0" y="720" width="1024" height="304" fill="#D9C7AE" stroke="none"/>
    <line x1="0" y1="720" x2="1024" y2="720"/>

    <!-- window -->
    <rect x="90" y="110" width="250" height="210" rx="10" fill="#BFE3F2"/>
    <line x1="215" y1="110" x2="215" y2="320"/>
    <line x1="90" y1="215" x2="340" y2="215"/>
    <path d="M115 300 q20 -40 50 -20 q20 -30 45 0" fill="#fff" stroke-width="5"/>

    <!-- wall clock -->
    <circle cx="840" cy="170" r="62" fill="#fff"/>
    <line x1="840" y1="170" x2="840" y2="128"/>
    <line x1="840" y1="170" x2="872" y2="182"/>
    <circle cx="840" cy="170" r="6" fill="#111"/>

    <!-- desk (behind character, right side) -->
    <rect x="600" y="480" width="360" height="30" fill="#B98A5E"/>
    <line x1="625" y1="510" x2="625" y2="740"/>
    <line x1="935" y1="510" x2="935" y2="740"/>
    <!-- monitor -->
    <rect x="680" y="330" width="200" height="130" rx="8" fill="#3B4A5A"/>
    <rect x="696" y="346" width="168" height="98" rx="4" fill="#9FD3E6" stroke-width="5"/>
    <line x1="780" y1="460" x2="780" y2="480"/>
    <line x1="745" y1="480" x2="815" y2="480"/>
    <!-- mug -->
    <rect x="895" y="440" width="34" height="40" rx="4" fill="#F28C8C" stroke-width="6"/>


    <!-- potted plant (left) -->
    <path d="M110 760 h120 l-15 120 h-90 z" fill="#E0895A"/>
    <path d="M170 760 q-70 -60 -40 -150 q40 60 40 150" fill="#7CC47A"/>
    <path d="M170 760 q60 -80 30 -170 q-50 70 -30 170" fill="#6BB36A"/>
    <path d="M170 760 q-10 -110 0 -200 q25 100 0 200" fill="#8AD488"/>

    <!-- office chair behind desk area -->
    <rect x="730" y="560" width="110" height="80" rx="18" fill="#5C6B7A"/>
    <line x1="785" y1="640" x2="785" y2="700"/>
    <line x1="745" y1="710" x2="825" y2="710"/>
    <circle cx="745" cy="718" r="9" fill="#111"/>
    <circle cx="825" cy="718" r="9" fill="#111"/>

    <!-- ===== Character ===== -->
    <g stroke-width="11">
      <!-- legs -->
      <line x1="480" y1="760" x2="465" y2="890"/>
      <line x1="544" y1="760" x2="559" y2="890"/>
      <line x1="465" y1="890" x2="430" y2="895"/>
      <line x1="559" y1="890" x2="594" y2="895"/>
      <!-- arms -->
      <line x1="440" y1="580" x2="375" y2="690"/>
      <line x1="584" y1="580" x2="640" y2="470"/>
      <!-- capsule body -->
      <rect x="430" y="520" width="164" height="270" rx="82" fill="#4F8FE8"/>
      <!-- head -->
      <circle cx="512" cy="410" r="105" fill="#FFE0C2"/>
    </g>
    <!-- glasses -->
    <g stroke-width="8" fill="#fff" fill-opacity="0.35">
      <circle cx="470" cy="405" r="32"/>
      <circle cx="554" cy="405" r="32"/>
      <line x1="502" y1="405" x2="522" y2="405"/>
      <line x1="438" y1="400" x2="410" y2="392"/>
      <line x1="586" y1="400" x2="614" y2="392"/>
    </g>
    <!-- eyes -->
    <circle cx="470" cy="407" r="8" fill="#111" stroke="none"/>
    <circle cx="554" cy="407" r="8" fill="#111" stroke="none"/>
    <!-- smile -->
    <path d="M482 460 q30 26 60 0" fill="none" stroke-width="8"/>
    <!-- cheeks -->
    <circle cx="438" cy="452" r="12" fill="#F7A9A0" stroke="none"/>
    <circle cx="586" cy="452" r="12" fill="#F7A9A0" stroke="none"/>
    <!-- hair tuft -->
    <path d="M490 308 q15 -30 30 -5 q12 -22 22 2" fill="none" stroke-width="8"/>
  </g>
</svg>
